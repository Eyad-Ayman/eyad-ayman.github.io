<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Code Maker — Eyad Ayman Tools</title>
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=5">
<style>
  :root { --accent: #d02b2a; --ink: #000; }
  * { box-sizing: border-box; }
  body { font-family: Inter, Arial, Helvetica, sans-serif; margin: 0; padding: 20px; color: #222; position: relative; background-color: #f6f1e6; }
  .tool-header { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
  .tool-header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  table.noborder td { padding: 10px 8px; vertical-align: top; }
  input[type="text"], input[type="number"], textarea { border: 1px solid #ccc; padding: 4px 6px; font-family: inherit; }
  a#download { color: var(--accent); font-weight: 700; text-decoration: none; }
  a#download:hover { text-decoration: underline; }

  @media screen and (max-width: 480px) {
    body { padding: 14px; }
    table.noborder, table.noborder tbody, table.noborder tr, table.noborder td { display: block; width: 100% !important; }
    table.noborder td { padding: 6px 0; }
    textarea, canvas, svg { max-width: 100%; }
    input[type="radio"] + label { margin-right: 10px; display: inline-block; }
  }

  /* Self-hosted animated film-grain, matching the main site */
  .noise-wrap {
    position: fixed;
    inset: 0;
    z-index: 100000;
    opacity: .85;
    pointer-events: none;
    overflow: hidden;
    mix-blend-mode: overlay;
  }
  .noise-texture {
    position: absolute;
    width: 300%;
    height: 300%;
    left: -100%;
    top: -100%;
    background-image: url("/assets/images/texture/grain.png");
    background-size: 220px 220px;
    background-repeat: repeat;
    animation: grain-shift 0.5s steps(4) infinite;
  }
  @keyframes grain-shift {
    0%   { transform: translate(0%, 0%); }
    25%  { transform: translate(-3%, 2%); }
    50%  { transform: translate(2%, -3%); }
    75%  { transform: translate(-2%, -2%); }
    100% { transform: translate(0%, 0%); }
  }
</style>
</head>
<body>

<div class="noise-wrap"><div class="noise-texture"></div></div>

<div class="tool-header">
  <h1>QR Code Maker</h1>
</div>

<article>
<form onsubmit="event.preventDefault();">
	<div id="loading" style="display: none;"></div>
	<div id="loaded"></div>
	<table class="noborder" style="width:100%">
		<tbody>
			<tr>
				<td><label for="text-input"><strong>Text string:</strong></label></td>
				<td style="width:100%"><textarea placeholder="Enter your text to be put into the QR Code" id="text-input" style="width:100%; max-width:30em; height:5em; font-family:inherit"></textarea></td>
			</tr>
			<tr>
				<td><strong>QR Code:</strong><br><a id="download" download="QRCODE.png" href="#">(DOWNLOAD)</a></td>
				<td>
					<canvas id="qrcode-canvas" width="232" height="232"></canvas>
					<svg xmlns="http://www.w3.org/2000/svg" id="qrcode-svg" style="width:30em; height:30em; display:none" stroke="none">
						<rect width="100%" height="100%" fill="#FFFFFF"></rect>
						<path d="" fill="#000000"></path>
					</svg>
				</td>
			</tr>
			<tr>
				<td><strong>Error correction:</strong></td>
				<td>
					<input type="radio" name="errcorlvl" id="errcorlvl-low" checked="checked"><label for="errcorlvl-low">Low</label>
					<input type="radio" name="errcorlvl" id="errcorlvl-medium"><label for="errcorlvl-medium">Medium</label>
					<input type="radio" name="errcorlvl" id="errcorlvl-quartile"><label for="errcorlvl-quartile">Quartile</label>
					<input type="radio" name="errcorlvl" id="errcorlvl-high"><label for="errcorlvl-high">High</label>
				</td>
			</tr>
			<tr>
				<td>Output format:</td>
				<td>
					<input type="radio" name="output-format" id="output-format-bitmap" checked="checked"><label for="output-format-bitmap">Bitmap</label>
					<input type="radio" name="output-format" id="output-format-vector"><label for="output-format-vector">Vector</label>
				</td>
			</tr>
			<tr>
				<td><label for="border-input">Border:</label></td>
				<td><input type="number" min="0" max="100" step="1" value="4" id="border-input" style="width:4em"> modules</td>
			</tr>
			<tr id="scale-row">
				<td><label for="scale-input">Scale:</label></td>
				<td><input type="number" min="1" max="30" step="1" value="8" id="scale-input" style="width:4em"> pixels per module</td>
			</tr>
			<tr>
				<td>Colors:</td>
				<td>
					Light = <input type="text" value="#FFFFFF" id="light-color-input" style="width:6em">,
					dark = <input type="text" value="#000000" id="dark-color-input" style="width:6em">
				</td>
			</tr>
			<tr>
				<td>Version range:</td>
				<td>
					Minimum = <input type="number" min="1" max="40" step="1" value="1" id="version-min-input" style="width:4em" oninput="app.handleVersionMinMax('min');">,
					maximum = <input type="number" min="1" max="40" step="1" value="40" id="version-max-input" style="width:4em" oninput="app.handleVersionMinMax('max');">
				</td>
			</tr>
			<tr>
				<td><label for="mask-input">Mask pattern:</label></td>
				<td><input type="number" min="-1" max="7" step="1" value="-1" id="mask-input" style="width:4em"> (−1 for automatic, 0 to 7 for manual)</td>
			</tr>
			<tr>
				<td>Boost ECC:</td>
				<td><input type="checkbox" checked="checked" id="boost-ecc-input"><label for="boost-ecc-input">Increase <abbr title="error correction code">ECC</abbr> level within same version</label></td>
			</tr>
		</tbody>
	</table>
	<p id="statistics-output"></p>
</form>
<script src="/tools/qr-code/qrcodegen.js" defer="defer"></script>
<script src="/tools/qr-code/qrcodegen-input.js" defer="defer"></script>
</article>

</body>
</html>
