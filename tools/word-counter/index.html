<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word &amp; Character Counter — Eyad Ayman Tools</title>
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=5">
<style>
  :root { --accent: #d02b2a; --ink: #000; }
  * { box-sizing: border-box; }
  body { font-family: Inter, Arial, Helvetica, sans-serif; margin: 0; padding: 20px; color: #222; position: relative; background-color: #fafafa; }
  .tool-header { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
  .tool-header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }

  textarea { width: 100%; min-height: 180px; border: 1px solid #000; padding: 14px; font-family: inherit; font-size: 15px; resize: vertical; background: #fff; }

  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 16px 0; }
  .stat { border: 1px solid #000; background: #fff; padding: 12px; text-align: center; }
  .stat-num { font-size: 26px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #666; margin-top: 4px; }

  .limits { margin-top: 20px; }
  .limits h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .5px; margin: 0 0 10px; }
  .limit-row { display: flex; align-items: center; justify-content: space-between; border: 1px solid #ccc; background: #fff; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; }
  .limit-bar-wrap { flex: 1; height: 6px; background: #eee; margin: 0 14px; position: relative; }
  .limit-bar { height: 100%; background: var(--accent); }
  .limit-bar.over { background: #b00000; }
  .limit-count { font-family: monospace; min-width: 90px; text-align: right; }

  /* Self-hosted animated film-grain, matching the main site */
  .noise-wrap { position: fixed; inset: 0; z-index: 100000; opacity: .85; pointer-events: none; overflow: hidden; mix-blend-mode: overlay; }
  .noise-texture { position: absolute; width: 300%; height: 300%; left: -100%; top: -100%; background-image: url("/assets/images/texture/grain.png"); background-size: 220px 220px; background-repeat: repeat; animation: grain-shift 0.5s steps(4) infinite; }
  @keyframes grain-shift {
    0%   { transform: translate(0%, 0%); }
    25%  { transform: translate(-3%, 2%); }
    50%  { transform: translate(2%, -3%); }
    75%  { transform: translate(-2%, -2%); }
    100% { transform: translate(0%, 0%); }
  }
</style>
</head>
<body>

<div class="noise-wrap"><div class="noise-texture"></div></div>

<div class="tool-header">
  <h1>Word &amp; Character Counter</h1>
</div>

<textarea id="text-input" placeholder="Paste or type your copy here&hellip;"></textarea>

<div class="stats-row">
  <div class="stat"><div class="stat-num" id="stat-chars">0</div><div class="stat-label">Characters</div></div>
  <div class="stat"><div class="stat-num" id="stat-chars-ns">0</div><div class="stat-label">No spaces</div></div>
  <div class="stat"><div class="stat-num" id="stat-words">0</div><div class="stat-label">Words</div></div>
  <div class="stat"><div class="stat-num" id="stat-sentences">0</div><div class="stat-label">Sentences</div></div>
  <div class="stat"><div class="stat-num" id="stat-paragraphs">0</div><div class="stat-label">Paragraphs</div></div>
  <div class="stat"><div class="stat-num" id="stat-read">0s</div><div class="stat-label">Read time</div></div>
</div>

<div class="limits">
  <h2>Platform limits</h2>
  <div id="limits-list"></div>
</div>

<script>
(function () {
  "use strict";
  var input = document.getElementById("text-input");
  var limits = [
    { name: "X / Twitter post", max: 280 },
    { name: "Instagram caption", max: 2200 },
    { name: "Facebook post (visible before “See more”)", max: 477 },
    { name: "LinkedIn post", max: 3000 },
    { name: "Meta description (SEO)", max: 160 },
    { name: "Title tag (SEO)", max: 60 },
    { name: "YouTube title", max: 100 }
  ];

  var limitsList = document.getElementById("limits-list");
  limits.forEach(function (l) {
    var row = document.createElement("div");
    row.className = "limit-row";
    row.innerHTML =
      '<span>' + l.name + '</span>' +
      '<div class="limit-bar-wrap"><div class="limit-bar" id="bar-' + l.max + '"></div></div>' +
      '<span class="limit-count" id="count-' + l.max + '">0 / ' + l.max + '</span>';
    limitsList.appendChild(row);
  });

  function update() {
    var text = input.value;
    var chars = text.length;
    var charsNoSpace = text.replace(/\s/g, "").length;
    var words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
    var sentences = text.trim() === "" ? 0 : (text.match(/[.!?]+(\s|$)/g) || []).length || (text.trim() ? 1 : 0);
    var paragraphs = text.trim() === "" ? 0 : text.split(/\n+/).filter(function (p) { return p.trim() !== ""; }).length;
    var readSeconds = Math.max(0, Math.round((words / 200) * 60));

    document.getElementById("stat-chars").textContent = chars;
    document.getElementById("stat-chars-ns").textContent = charsNoSpace;
    document.getElementById("stat-words").textContent = words;
    document.getElementById("stat-sentences").textContent = sentences;
    document.getElementById("stat-paragraphs").textContent = paragraphs;
    document.getElementById("stat-read").textContent = readSeconds < 60 ? readSeconds + "s" : Math.round(readSeconds / 60) + "m";

    limits.forEach(function (l) {
      var bar = document.getElementById("bar-" + l.max);
      var count = document.getElementById("count-" + l.max);
      var pct = Math.min(100, (chars / l.max) * 100);
      bar.style.width = pct + "%";
      bar.className = "limit-bar" + (chars > l.max ? " over" : "");
      count.textContent = chars + " / " + l.max;
    });
  }

  input.addEventListener("input", update);
  update();
})();
</script>

</body>
</html>
